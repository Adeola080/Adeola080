<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Cost Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Energy Cost Calculator</h1>
            <p>Calculate the electricity cost of your home appliances</p>
        </header>

        <main>
            <div class="calculator-card">
                <div class="settings-section">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="currency">Currency</label>
                            <select id="currency">
                                <option value="$" data-code="USD">USD ($)</option>
                                <option value="€" data-code="EUR">EUR (€)</option>
                                <option value="£" data-code="GBP">GBP (£)</option>
                                <option value="¥" data-code="JPY">JPY (¥)</option>
                                <option value="₹" data-code="INR">INR (₹)</option>
                                <option value="A$" data-code="AUD">AUD (A$)</option>
                                <option value="C$" data-code="CAD">CAD (C$)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="cost-kwh">Electricity Cost (per kWh)</label>
                            <input type="number" id="cost-kwh" required min="0" step="0.001" placeholder="e.g., 0.15" value="0.15">
                        </div>
                    </div>
                </div>

                <hr class="divider">

                <form id="appliance-form">
                    <div class="form-group">
                        <label for="appliance-name">Appliance</label>
                        <input type="text" id="appliance-name" list="appliance-suggestions" placeholder="Select or type an appliance..." required autocomplete="off">
                        <datalist id="appliance-suggestions">
                            <!-- Populated via JS -->
                        </datalist>
                    </div>

                    <div class="form-group">
                        <label for="power-watts">Power Usage (Watts)</label>
                        <input type="number" id="power-watts" required min="0" placeholder="e.g., 150">
                    </div>

                    <div class="form-group">
                        <label for="usage-hours">Usage per Day (Hours)</label>
                        <input type="number" id="usage-hours" required min="0" max="24" step="0.1" placeholder="e.g., 24">
                    </div>

                    <button type="submit" class="btn">Add Appliance</button>
                    <button type="button" id="clear-form-btn" class="btn btn-secondary">Clear</button>
                </form>

                <div id="appliance-list-section" class="hidden">
                    <h3>Appliance List</h3>
                    <div class="table-responsive">
                        <table id="appliance-table">
                            <thead>
                                <tr>
                                    <th>Appliance</th>
                                    <th>Power (W)</th>
                                    <th>Hours/Day</th>
                                    <th>Daily Cost</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="appliance-tbody">
                                <!-- Populated via JS -->
                            </tbody>
                        </table>
                    </div>

                    <div id="results" class="results-section">
                        <h2>Grand Total Costs</h2>
                        <div class="result-grid">
                            <div class="result-box">
                                <h3>Daily</h3>
                                <p class="cost" id="cost-daily">$0.00</p>
                                <p class="usage" id="usage-daily">0.00 kWh</p>
                            </div>
                            <div class="result-box">
                                <h3>Monthly</h3>
                                <p class="cost" id="cost-monthly">$0.00</p>
                                <p class="usage" id="usage-monthly">0.00 kWh</p>
                            </div>
                            <div class="result-box">
                                <h3>Yearly</h3>
                                <p class="cost" id="cost-yearly">$0.00</p>
                                <p class="usage" id="usage-yearly">0.00 kWh</p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
