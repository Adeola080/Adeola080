<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Cost Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Energy Cost Calculator</h1>
            <p>Calculate the electricity cost of your home appliances</p>
        </header>

        <main>
            <div class="calculator-card">
                <form id="energy-form">
                    <div class="form-group">
                        <label for="appliance-name">Appliance Name (optional)</label>
                        <input type="text" id="appliance-name" placeholder="e.g., Refrigerator">
                    </div>

                    <div class="form-group">
                        <label for="power-watts">Power Usage (Watts)</label>
                        <input type="number" id="power-watts" required min="0" placeholder="e.g., 150">
                    </div>

                    <div class="form-group">
                        <label for="usage-hours">Usage per Day (Hours)</label>
                        <input type="number" id="usage-hours" required min="0" max="24" step="0.1" placeholder="e.g., 24">
                    </div>

                    <div class="form-group">
                        <label for="cost-kwh">Electricity Cost (per kWh in $)</label>
                        <input type="number" id="cost-kwh" required min="0" step="0.01" placeholder="e.g., 0.15">
                    </div>

                    <button type="submit" class="btn">Calculate Cost</button>
                    <button type="button" id="reset-btn" class="btn btn-secondary">Reset</button>
                </form>

                <div id="results" class="results-section hidden">
                    <h2>Estimated Costs <span id="display-appliance"></span></h2>

                    <div class="result-grid">
                        <div class="result-box">
                            <h3>Daily</h3>
                            <p class="cost" id="cost-daily">$0.00</p>
                            <p class="usage" id="usage-daily">0.00 kWh</p>
                        </div>
                        <div class="result-box">
                            <h3>Monthly</h3>
                            <p class="cost" id="cost-monthly">$0.00</p>
                            <p class="usage" id="usage-monthly">0.00 kWh</p>
                        </div>
                        <div class="result-box">
                            <h3>Yearly</h3>
                            <p class="cost" id="cost-yearly">$0.00</p>
                            <p class="usage" id="usage-yearly">0.00 kWh</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
